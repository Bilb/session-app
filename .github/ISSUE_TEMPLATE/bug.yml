name: Bug report
description: Something in Session 2.0 is broken
labels: [bug, triage]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      multiple: true
      options: [iOS, Android, macOS, Windows, Linux]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
      description: At the bottom of Settings. Copy everything shown there.
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Settings > Help > Export Logs, then attach the file.
