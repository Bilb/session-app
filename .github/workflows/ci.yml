name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Only the localization submodule is checked out here. libsession-util is pinned at a commit
      # the remote does not have, so cloning it fails outright; and it drags in protobuf and
      # session-deps, which nothing in these checks compiles. `urls.generated.ts` is therefore
      # verified against the library only where the submodule is present -- see generateUrls.ts.
      - run: git submodule update --init --recursive packages/localization/src/localization-src

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Restore turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm lint:manifests
      - run: pnpm boundaries
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm knip
      - run: pnpm dedupe --check
      - run: pnpm codegen:check
