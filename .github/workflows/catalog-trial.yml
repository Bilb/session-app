name: catalog-trial

# Throwaway measurement: the pr-tier catalog on the self-hosted runner at several shard counts,
# one job at a time so they do not compete for the host.
on:
  push:
    branches: [trial/catalog-hosted]

permissions:
  contents: read

jobs:
  self:
    name: shards-${{ matrix.shards }}-${{ matrix.rep }}
    runs-on: [self-hosted, linux, x64, session-catalog]
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        rep: [1, 2]
        shards: ['8', '12', '16', '4']
    env:
      CATALOG_TIER: pr
      CATALOG_OUT: ${{ github.workspace }}/test-results/catalog
      CATALOG_SHARDS: ${{ matrix.shards }}
    steps:
      - run: hostname && nproc && uptime
      - uses: actions/checkout@v5
      - run: git submodule update --init --recursive packages/localization/src/localization-src
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @session/localization build
      - run: pnpm --filter @session/desktop build
      - run: pnpm fake-media:fetch
      - name: Build the capture image
        run: docker build --quiet --tag session-catalog tests/e2e/catalog
      - name: Capture
        run: |
          uptime
          pnpm --filter @session/e2e test:catalog
          uptime
