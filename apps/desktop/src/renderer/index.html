<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Session</title>
    <style>
      html,
      body,
      #root {
        height: 100%;
        margin: 0;
        overflow: hidden;
      }
      /*
        react-native's layout assumes every ancestor is a flex container; the browser's is
        not. Without this the app's root `flex: 1` has no flex parent to grow inside, so it
        computes to auto height, and every screen renders at zero pixels tall while looking
        perfectly correct in the DOM.
      */
      #root {
        display: flex;
        flex-direction: column;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
