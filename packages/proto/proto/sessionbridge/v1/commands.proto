syntax = "proto3";

package sessionbridge.v1;

// libsession bundles protobuf-lite and nothing else, and the shim links against that
// same copy. Lite drops reflection, TextFormat and JSON, none of which cross this
// bridge. protobuf-es ignores this option, so the TypeScript codecs are unaffected.
option optimize_for = LITE_RUNTIME;

import "sessionbridge/v1/types.proto";

// Everything the app asks libsession to do.
//
// One Request goes in, exactly one Response comes back on the frame stream carrying the
// same id. Commands are named for what the app wants, not for the C++ method that serves
// them, so that a refactor upstream is a shim change rather than a wire change.

message Request {
  uint32 id = 1;

  oneof cmd {
    // Lifecycle and account
    GetAccountInfo get_account_info = 10;
    CreateAccount create_account = 11;
    RestoreAccount restore_account = 12;
    GetSeedMnemonic get_seed_mnemonic = 13;
    SetDisplayName set_display_name = 14;
    AttachNetwork attach_network = 15;
    PollOnce poll_once = 16;
    SetPushToken set_push_token = 17;
    HandlePushPayload handle_push_payload = 18;

    // Conversations
    GetConversations get_conversations = 30;
    GetMessageRequests get_message_requests = 31;
    GetConversation get_conversation = 32;
    OpenDm open_dm = 33;
    MarkRead mark_read = 34;
    SetBlocked set_blocked = 35;
    SetNickname set_nickname = 36;
    SetPriority set_priority = 37;
    ApproveConversation approve_conversation = 38;
    DeleteConversation delete_conversation = 39;

    // Messages
    GetMessages get_messages = 50;
    SendMessage send_message = 51;
    RetrySend retry_send = 52;
    DeleteMessage delete_message = 53;

    // Attachments
    AttachmentData attachment_data = 70;
    SaveAttachment save_attachment = 71;

    // App preferences, stored in libsession's globals table so they sit beside the account
    // instead of in a second store the app would have to keep in step.
    GetPref get_pref = 90;
    SetPref set_pref = 91;

    // Compiled into the shim only under SESSION_BRIDGE_TESTING: feeds an inbound message
    // straight into Core the way the swarm would have, so the contract suite can exercise
    // the receive path with no network.
    DeliverTestMessage deliver_test_message = 200;
  }
}

message GetAccountInfo {}
message CreateAccount {}

message RestoreAccount {
  oneof from {
    RecoveryWords words = 1;
    string hex_seed = 2;
  }
}
message RecoveryWords {
  repeated string words = 1;
  optional string language = 2;
}

message GetSeedMnemonic {
  optional string language = 1;
}

message SetDisplayName {
  string name = 1;
}

message AttachNetwork {
  // "mainnet" | "testnet" | "devnet". Declining to attach is how an app stays offline.
  string netid = 1;
  optional string devnet_seed_url = 2;
}

// Run one poll cycle to completion. This is the primitive every OS background budget wants:
// Android's WorkManager job, iOS's BGAppRefreshTask, and the fetch a push notification
// triggers all reduce to "poll now, tell me when you are done".
message PollOnce {}

message SetPushToken {
  string platform = 1;
  string token = 2;
}

// Interpret a push payload far enough to notify. Answering from the payload alone matters
// on iOS, where the notification service extension runs while the app holds the database.
message HandlePushPayload {
  bytes payload = 1;
}

message GetConversations {}
message GetMessageRequests {}

message GetConversation {
  string conversation_id = 1;
}

message OpenDm {
  string session_id = 1;
}

message MarkRead {
  string conversation_id = 1;
  optional int64 up_to = 2;
}

message SetBlocked {
  string conversation_id = 1;
  bool blocked = 2;
}

message SetNickname {
  string conversation_id = 1;
  optional string nickname = 2;
}

message SetPriority {
  string conversation_id = 1;
  int32 priority = 2;
}

message ApproveConversation {
  string conversation_id = 1;
}

message DeleteConversation {
  string conversation_id = 1;
  bool keep_messages = 2;
}

message GetMessages {
  string conversation_id = 1;
  uint32 limit = 2;
  optional MessageCursor before = 3;
  bool include_deleted = 4;
}

message SendMessage {
  string conversation_id = 1;
  string body = 2;
  repeated OutgoingAttachment attachments = 3;
  optional int64 reply_to = 4;
}

message RetrySend {
  int64 message_id = 1;
}

message DeleteMessage {
  int64 message_id = 1;
  Deletion scope = 2;
}

message AttachmentData {
  int64 message_id = 1;
  uint32 index = 2;
}

message SaveAttachment {
  int64 message_id = 1;
  uint32 index = 2;
  string destination = 3;
  bool notify_sender = 4;
  bool replace = 5;
}

message GetPref {
  string key = 1;
}

message SetPref {
  string key = 1;
  string value = 2;
}

message DeliverTestMessage {
  string sender_seed = 1;
  string conversation_id = 2;
  string body = 3;
  int64 timestamp = 4;
}
